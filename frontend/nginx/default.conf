map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name init-hub-frontend www.inithub.site;
  return 301 https://$host$request_uri;

  location = /index {
    return 301 /;
  }

  location = /index.html {
    return 301 /;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl;
  server_name init-hub-frontend www.inithub.site;

  ssl_certificate /etc/letsencrypt/live/inithub.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/inithub.site/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # Backend API
  location /backend/ {
    proxy_pass http://init-hub-backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  # Agent
  location /agent/ {
    proxy_pass http://init-hub-agent:8000/;
    proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}
