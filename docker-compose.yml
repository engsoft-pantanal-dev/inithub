version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: inithub-postgres
    environment:
      POSTGRES_DB: inithub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inithub"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - init-hub-network

  backend:
    build:
      context: ./backend
      dockerfile: ./docker/backend.dockerfile
    container_name: init-hub-backend
    restart: always
    env_file: "./.env"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy &&
             node dist/prisma/seed.js &&
             node dist/src/main.js"
    ports:
      - "3000:3000"
    networks:
      - init-hub-network

  agent:
    build:
      context: ./agent
      dockerfile: ./docker/agent.dockerfile
    container_name: init-hub-agent
    restart: always
    env_file: "./.env"
    volumes:
      - ./agent:/app
    ports:
      - "8000:8000"
    networks:
      - init-hub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ./docker/frontend.dockerfile
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    container_name: init-hub-frontend
    restart: always
    env_file: "./.env"
    networks:
      - init-hub-network
    depends_on:
      - backend
      - agent

  # nginx:
  #   image: nginx:1.24
  #   container_name: inithub-nginx
  #   volumes:
  #     - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   depends_on:
  #     - frontend
  #     - backend
  #     - agent
  #   networks:
  #     - init-hub-network

networks:
  init-hub-network:
    driver: bridge

volumes:
  pg_data:
  nginx-frontend:
